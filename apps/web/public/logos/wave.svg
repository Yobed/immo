<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Cyan background -->
  <rect width="120" height="120" rx="22" fill="#00C3F7"/>
  <!-- Penguin body (black) -->
  <ellipse cx="60" cy="72" rx="28" ry="34" fill="#0A0A0A"/>
  <!-- Penguin head -->
  <ellipse cx="60" cy="38" rx="22" ry="22" fill="#0A0A0A"/>
  <!-- White belly -->
  <ellipse cx="60" cy="76" rx="17" ry="22" fill="white"/>
  <!-- Left eye -->
  <circle cx="52" cy="33" r="4" fill="white"/>
  <circle cx="52" cy="33" r="2" fill="#0A0A0A"/>
  <!-- Right eye -->
  <circle cx="68" cy="33" r="4" fill="white"/>
  <circle cx="68" cy="33" r="2" fill="#0A0A0A"/>
  <!-- Beak -->
  <path d="M55 42 Q60 48 65 42 Q60 44 55 42z" fill="#FF8C00"/>
  <!-- Left wing -->
  <path d="M32 58 Q18 50 22 72 Q28 80 36 74 Q32 68 32 58z" fill="#0A0A0A"/>
  <!-- Right wing (raised - waving) -->
  <path d="M88 55 Q104 42 100 62 Q94 72 84 68 Q88 62 88 55z" fill="#0A0A0A"/>
  <!-- Left foot -->
  <ellipse cx="48" cy="104" rx="12" ry="7" fill="#FF8C00"/>
  <!-- Right foot -->
  <ellipse cx="72" cy="104" rx="12" ry="7" fill="#FF8C00"/>
</svg>
